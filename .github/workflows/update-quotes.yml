name: Multi-Market Stock Quotes Auto-Sync

on:
  schedule:
    # 1. Asian Markets (TWSE / TPEX / HKEX / TSE): 09:00 - 16:00 (UTC+8) -> 01:00 - 08:00 (UTC), Mon-Fri
    # 2. US Markets (NASDAQ / NYSE): 09:30 - 16:00 (EST) -> 14:30 - 21:00 (UTC), Mon-Fri
    # Runs every 15 minutes across active regional trading hours
    - cron: '*/15 1-8,14-21 * * 1-5'
  workflow_dispatch: # Allow manual trigger via GitHub web UI

permissions:
  contents: write

jobs:
  fetch-quotes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Regional Quotes (Taiwan, US, HK, JP)
        run: |
          python3 scripts/fetch_tw_quotes.py

      - name: Commit and push if quotes updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/quotes.json
          if git diff --staged --quiet; then
            echo "No changes in quotes.json, skipping commit."
          else
            git commit -m "chore(data): 依各地交易所開收盤自動排程同步即時報價 [skip ci]"
            git push origin main
          fi
