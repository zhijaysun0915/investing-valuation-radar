name: Update Valuations & Analyst Targets

on:
  schedule:
    # Runs every Sunday at 18:00 UTC (Monday 02:00 Taiwan time) to refresh weekly financial model valuations & analyst targets
    - cron: '0 18 * * 0'
  workflow_dispatch: # Allow manual trigger via GitHub web UI anytime

permissions:
  contents: write

jobs:
  sync-valuations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Valuations Sync Script
        run: |
          python3 scripts/update_valuations.py

      - name: Commit and push if valuations updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/valuations.json
          if git diff --staged --quiet; then
            echo "No changes in valuations.json, skipping commit."
          else
            git commit -m "chore(data): 定期同步 InvestingPro 公允價值與外資分析師目標價 [skip ci]"
            git push origin main
          fi
