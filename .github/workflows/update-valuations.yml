name: Daily Fundamentals Auto-Update (Analyst Targets / Fair Value / PE-PB / Period Returns)

on:
  schedule:
    # Every weekday 15:10 Taiwan time (07:10 UTC), after TWSE/TPEX close & official P/E publication
    - cron: '10 7 * * 1-5'
    # Every weekday 06:30 Taiwan time (22:30 UTC prev day), after US close (refresh US analyst data)
    - cron: '30 22 * * 1-5'
  workflow_dispatch: # Allow manual trigger via GitHub web UI anytime

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  sync-fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch fundamentals (Yahoo history + analyst consensus, TWSE/TPEX official PE/PB)
        run: |
          python3 scripts/update_fundamentals.py

      - name: Fetch institutional analyst ratings & price target tables (Yahoo US + Investing.com TW/HK/JP)
        run: |
          python3 scripts/update_analyst_ratings.py || echo "Warning: analyst_ratings partial update"

      - name: Commit and push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fundamentals.json data/analyst_ratings.json
          if git diff --staged --quiet; then
            echo "No changes in fundamentals/analyst_ratings, skipping commit."
          else
            git commit -m "chore(data): 每日自動更新學術六模型估值、外資券商目標價明細與區間報酬 [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
